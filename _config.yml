url: "https://gaojh-cs.github.io"
baseurl: ""
repository: "gaojh-cs/gaojh-cs.github.io"
layout: sidebar
style: light
title: "Academic Homepage"

# 在这里编辑主页左侧显示的个人资料。
profile:
  name: "Junhui GAO"
  position: "PhD Student, CityUHK"
  bio: "I obtained my B.Eng. in Computer Science and Technology from Northwestern Polytechnical University in 2023. Currently, I am pursuing my Ph.D. degree at Hong Kong Jockey Club STEM Lab of Smart City under the supervision of [Prof. Yuguang Fang](https://www.cs.cityu.edu.hk/~yugufang/) at the Department of Computer Science, City University of Hong Kong. My research interests include data-driven methods, UAV applications, and Low-Altitude Economy. "
  # 头像下方的短介绍；留空时不显示。
  sidebar_bio: ""
  location: "HKSAR, China"
  email: "junhui.gao@my.cityu.edu.hk"
  # 填写完整的 Google Scholar 个人主页网址。
  google_scholar: "https://scholar.google.com/citations?user=kqo8nkMAAAAJ"
  # 把正方形头像放进仓库后填写路径，例如：
  avatar: "/assets/images/123.jpg"
  # avatar: ""

plugins:
  - jekyll-octicons
  - jekyll-github-metadata
  - jemoji

permalink: /:year/:month/:day/:title/

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "posts"
    values:
      layout: "post"

